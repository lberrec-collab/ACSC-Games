  { w: 4, f: s => { if (s.prof === 2) return 'A mission command debate broke out. The Army officer settled it in one sentence.'; s.week++; s.pages += 40; return 'The Army officer explained mission command. Again. Lost a week, gained 40 pages.'; } },
  { w: 3, f: s => { s.pages = Math.max(0, s.pages - 20); return 'Someone said "strategic corporal" unironically. Fell 20 pages behind.'; } },

const rnd = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const shuffle = a => a.slice().sort(() => Math.random() - 0.5);
const alive = s => s.party.filter(m => m.hp > 0);

function consume() {

function travel(note) {
  S.log = note ? [note] : [];

  if (S.weather === 'Heavy fog') S.log.push('Heavy fog. Nobody can find the seminar room.');
  if (S.weather === 'Tornado watch' && Math.random() < 0.5) { S.week++; S.log.push('Tornado watch. A week lost sheltering in the hallway with the Marines.'); }
  S.week++;
  const before = S.before;
  S.pages = Math.min(PAGES_TOTAL, S.pages + PACES[S.pace][1]);
  consume();
  if (Math.random() < 0.45) { const ev = weighted(EVENTS).f(S); if (ev) S.log.push(ev); }

  const lm = LANDMARKS.find(l => l.at > before && l.at <= S.pages);

function weighted(list) { const tot = list.reduce((a, e) => a + e.w, 0); let r = Math.random() * tot; for (const e of list) { r -= e.w; if (r <= 0) return e; } return list[0]; }

function askQuestion(intro, onResult, allowTutor, remove = 0) {

const sc = document.getElementById('scene'), sx = sc.getContext('2d');
let sceneT = 0, lastT = 0;
function scene(ts) {
  const dt = Math.min(0.05, (ts - lastT) / 1000 || 0); lastT = ts; sceneT += dt;
  const W = 400, H = 100, moving = !!S && S.party.length > 0 && alive(S).length > 0;
  sx.fillStyle = '#040804'; sx.fillRect(0, 0, W, H);
  const prog = S ? S.pages / PAGES_TOTAL : 0;
  const scroll = (S ? S.pages * 3 : 0) + (moving ? sceneT * 0 : 0);
  sx.fillStyle = '#1f8a3e';
  for (let i = 0; i < 14; i++) { const hx = ((i * 60 - scroll * 0.3) % (W + 80) + W + 80) % (W + 80) - 40; const hh = 10 + (i * 7) % 16; sx.fillRect(hx, 66 - hh, 40, hh); }
  sx.fillStyle = '#39ff6a'; sx.fillRect(0, 66, W, 2);
  sx.fillStyle = '#0f4a22'; sx.fillRect(0, 68, W, 32);
  sx.fillStyle = '#39ff6a';
  for (let i = 0; i < 12; i++) { const gx = ((i * 45 - scroll) % (W + 20) + W + 20) % (W + 20) - 10; sx.fillRect(gx, 72 + (i % 3) * 8, 3, 2); }
  // landmark post
  if (S) { const next = LANDMARKS.find(l => l.at > S.pages); if (next) { const px = 120 + (next.at - S.pages) * 0.9; if (px < W) { sx.fillStyle = '#f2c14e'; sx.fillRect(px, 40, 2, 26); sx.fillRect(px, 40, 12, 7); } } }
  // the wagon: a golf cart stacked with books
  const bob = moving ? Math.sin(sceneT * 8) : 0;
  const wx = 80, wy = 58 + bob;
  sx.fillStyle = '#7fc78f';
  sx.fillRect(wx, wy - 12, 34, 12); sx.fillRect(wx + 4, wy - 22, 22, 10);
  sx.fillStyle = '#f2c14e'; for (let i = 0; i < 4; i++) sx.fillRect(wx + 6 + i * 5, wy - 30 + (i % 2) * 2, 4, 8);
  sx.fillStyle = '#39ff6a'; sx.fillRect(wx + 5, wy, 6, 6); sx.fillRect(wx + 23, wy, 6, 6);
  sx.fillStyle = '#040804'; sx.fillRect(wx + 7 + (moving ? Math.round(sceneT * 6) % 3 : 0), wy + 2, 2, 2); sx.fillRect(wx + 25 + (moving ? Math.round(sceneT * 6 + 1) % 3 : 0), wy + 2, 2, 2);
  sx.font = '7px "Press Start 2P", monospace'; sx.fillStyle = '#7fc78f'; sx.textBaseline = 'top';
  sx.fillText(S && S.party.length ? `MAXWELL AFB  ->  GRADUATION   ${Math.round(prog * 100)}%` : 'THE ACSC TRAIL', 8, 8);
  sx.fillStyle = 'rgba(57,255,106,.2)'; sx.fillRect(8, 20, 384, 3); sx.fillStyle = '#39ff6a'; sx.fillRect(8, 20, 384 * prog, 3);
  requestAnimationFrame(scene);
}
requestAnimationFrame(scene);
title();
})();
