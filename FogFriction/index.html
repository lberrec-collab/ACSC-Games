<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Fog &amp; Friction">
<meta name="theme-color" content="#232a33">
<title>Fog &amp; Friction – Bingo Fuel Arcade</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#232a33; --panel:#2e3742; --text:#e6e1d3; --muted:#9aa4ad; --accent:#f2c14e;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--text);
    font-family:"Press Start 2P","Courier New",monospace}
  body{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;
    padding:max(24px,env(safe-area-inset-top)) 12px max(40px,env(safe-area-inset-bottom));
    touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
    overscroll-behavior:none}
  header{width:100%;max-width:440px;font-size:9px;color:var(--muted);display:flex;
    justify-content:space-between;margin-bottom:28px}
  h1{font-size:20px;line-height:1.5;margin:0 0 10px;color:var(--accent)}
  .tag{font-size:9px;line-height:2;max-width:420px;margin:0 0 18px}
  .tag em{font-style:normal;color:var(--muted)}
  .cab{background:var(--panel);padding:10px;border-radius:6px;
    box-shadow:0 0 0 4px #14181d,0 0 0 6px #4a5561}
  canvas{display:block;width:min(400px,calc(100vw - 44px));aspect-ratio:2/3;height:auto;
    background:#7f9bb3;touch-action:none;cursor:pointer;outline:none;image-rendering:pixelated}
  canvas:focus-visible{box-shadow:0 0 0 3px var(--accent)}
  footer{font-size:8px;line-height:1.9;color:var(--muted);max-width:420px;margin-top:26px;text-align:center}
</style>
</head>
<body>
<header><span>Air University Arcade</span><span>Now playing</span></header>
<h1>Fog &amp; Friction</h1>
<p class="tag">Pilot a B-52 through Clausewitzian fog.<br>
<em>The fog gets longer the further you go. That is the point.</em></p>
<div class="cab"><canvas id="g" width="400" height="600" tabindex="0"
  aria-label="Fog and Friction game. Tap, click, or press space to climb."></canvas></div>
<footer>Every objective you clear is a paragraph you don't have to write.<br>
Not affiliated with Air University. Obviously.</footer>

<script>
(() => {
const W = 400, H = 600, GROUND = H - 56;
const cv = document.getElementById('g');
const ctx = cv.getContext('2d');
function fit() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = W * dpr; cv.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.imageSmoothingEnabled = false;
}
fit(); addEventListener('resize', fit);

// ---------- content ----------
const THEORISTS = ['CLAUSEWITZ','JOMINI','SUN TZU','MAHAN','CORBETT','DOUHET','MITCHELL','WARDEN','BOYD','THUCYDIDES','GRAY','MOLTKE'];
const QUOTES = [
  'War is politics by other means.',
  'Everything in war is simple. The simplest thing is difficult.',
  'Three-quarters of the factors in war are wrapped in fog.',
  'Friction makes the seemingly easy difficult.',
  'The center of gravity is the hub of all power. Find it. Or don\'t.',
  'Defense is the stronger form of war. Discuss in five pages.',
  'No plan survives contact. (Moltke. Not on this week\'s reading.)',
  'Fog is not a bug. It is the reading list.',
  'Genius rises above all rules. Your rubric does not.',
];
const GRADES = [
  [25, 'A. Distinguished Graduate. Please stop flying.'],
  [15, 'B. Meets standards. Deep engagement with fog.'],
  [8,  'C. Satisfactory. Cites Clausewitz, misspells it.'],
  [3,  'D. Marginal. Confused fog with friction.'],
  [0,  'F. Did not do the reading.'],
];
const grade = s => GRADES.find(g => s >= g[0])[1];

// ---------- state ----------
let state = 'title', t = 0, last = 0, best = 0, score = 0;
let plane, obs, clouds, toasts, banner, fog, fogStart, fogDur, nextFog, warn,
    friction, nextFriction, spawnAt, deadAt, deathReason, scroll;
const rnd = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

function reset() {
  plane = { x: 96, y: 260, vy: 0 };
  obs = []; toasts = []; banner = null;
  clouds = Array.from({ length: 6 }, () => ({ x: rnd(0, W), y: rnd(30, 300), w: rnd(50, 110), s: rnd(8, 20) }));
  fog = 0; fogStart = -1; fogDur = 0; nextFog = 6; warn = false;
  friction = false; nextFriction = 12;
  spawnAt = 1.4; t = 0; score = 0; scroll = 0; deathReason = '';
}
reset();

// ---------- input ----------
function press(e) {
  if (e) e.preventDefault();
  if (state === 'title') { state = 'play'; reset(); return; }
  if (state === 'dead') { if (t - deadAt > 0.7) { state = 'play'; reset(); } return; }
  flap();
}
function flap() { plane.vy = -400; }
function toast(s) { toasts.push({ s, x: plane.x + 30, y: plane.y - 18, ttl: 1.1 }); }
cv.addEventListener('pointerdown', press);
addEventListener('keydown', e => { if (e.code === 'Space' || e.code === 'ArrowUp') press(e); });

// ---------- update ----------
function update(dt) {
  t += dt;
  scroll += 150 * dt;
  for (const c of clouds) { c.x -= c.s * dt; if (c.x + c.w < 0) { c.x = W + 20; c.y = rnd(30, 300); } }
  if (state === 'title') { plane.y = 260 + Math.sin(t * 2.5) * 10; return; }
  if (state === 'dead') { plane.vy += 1500 * dt; plane.y = Math.min(GROUND - 8, plane.y + plane.vy * dt); return; }

  // physics
  plane.vy = clamp(plane.vy + 1500 * dt, -400, 650);
  plane.y += plane.vy * dt;
  if (plane.y < 12) { plane.y = 12; plane.vy = 0; }

  // obstacles
  spawnAt -= dt;
  if (spawnAt <= 0) {
    spawnAt = 1.65;
    const gap = 165;
    obs.push({ x: W + 40, w: 62, gapY: rnd(90, GROUND - 90 - gap), gap, name: THEORISTS[Math.floor(Math.random() * THEORISTS.length)], scored: false });
  }
  for (const o of obs) {
    o.x -= 150 * dt;
    if (!o.scored && o.x + o.w < plane.x) { o.scored = true; score++; if (score % 5 === 0) banner = { text: QUOTES[(score / 5 - 1) % QUOTES.length], ttl: 3.2 }; }
  }
  obs = obs.filter(o => o.x + o.w > -10);

  // fog: a full whiteout every 5-10 s; lasts longer the further you get
  warn = fogStart < 0 && t > nextFog - 0.6;
  if (fogStart < 0 && t > nextFog) { fogStart = t; fogDur = clamp(0.7 + score * 0.06, 0.7, 2.6); }
  if (fogStart >= 0) {
    const e = t - fogStart, IN = 0.25, OUT = 0.35;
    if (e < IN) fog = e / IN;
    else if (e < IN + fogDur) fog = 1;
    else if (e < IN + fogDur + OUT) fog = 1 - (e - IN - fogDur) / OUT;
    else { fog = 0; fogStart = -1; nextFog = t + rnd(5, 10); }
  }

  // friction: an occasional single gust. Annoying, not lethal.
  friction = false;
  if (t > nextFriction) {
    nextFriction = t + rnd(9, 16); friction = true;
    plane.vy += rnd(-1, 1) < 0 ? -140 : 160;
    toast('friction');
  }

  // collisions
  const px = plane.x, py = plane.y, hw = 22, hh = 8;
  if (py + hh >= GROUND) die('Fielded forces destroyed on the ground. Should have targeted leadership.');
  for (const o of obs) {
    if (px + hw > o.x && px - hw < o.x + o.w && (py - hh < o.gapY || py + hh > o.gapY + o.gap))
      die('Collided with ' + o.name + '. Recommend re-reading the assigned chapters.');
  }

  for (const tt of toasts) { tt.ttl -= dt; tt.y -= 28 * dt; }
  toasts = toasts.filter(tt => tt.ttl > 0);
  if (banner) { banner.ttl -= dt; if (banner.ttl <= 0) banner = null; }
}
function die(reason) {
  if (state !== 'play') return;
  state = 'dead'; deadAt = t; deathReason = reason; best = Math.max(best, score);
}

// ---------- draw ----------
function txt(s, x, y, size, color, align = 'left') {
  ctx.font = size + 'px "Press Start 2P", "Courier New", monospace';
  ctx.fillStyle = color; ctx.textAlign = align; ctx.textBaseline = 'top';
  ctx.fillText(s, x, y);
}
function wrap(s, x, y, size, color, maxW, lh) {
  ctx.font = size + 'px "Press Start 2P", "Courier New", monospace';
  const words = s.split(' '); let line = '', yy = y;
  for (const w of words) {
    const test = line ? line + ' ' + w : w;
    if (ctx.measureText(test).width > maxW && line) { txt(line, x, yy, size, color, 'center'); line = w; yy += lh; }
    else line = test;
  }
  if (line) txt(line, x, yy, size, color, 'center');
  return yy + lh;
}
function drawPlane(p) {
  ctx.save(); ctx.translate(p.x, p.y);
  ctx.rotate(state === 'title' ? 0 : clamp(p.vy / 650, -0.45, 1) * 0.6);
  ctx.fillStyle = '#8d949c';
  ctx.fillRect(-26, -4, 52, 8);            // fuselage
  ctx.fillRect(26, -3, 6, 6);              // nose
  ctx.fillRect(-26, -19, 6, 15);           // tail fin
  ctx.fillRect(-31, -6, 8, 3);             // stabilizer
  ctx.fillStyle = '#777e86';               // swept wing
  ctx.beginPath(); ctx.moveTo(-2, -2); ctx.lineTo(12, -2); ctx.lineTo(-6, 15); ctx.lineTo(-18, 15); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#5f666e';               // engine pods
  ctx.fillRect(0, 5, 10, 4); ctx.fillRect(-8, 10, 10, 4);
  ctx.fillStyle = '#2f3a48'; ctx.fillRect(17, -3, 7, 3);  // cockpit
  ctx.restore();
}
const BOOKS = ['#5b3a29', '#3e4a3a', '#6b5b3e', '#4a3b5c', '#7a4b2b', '#2f4a5e'];
function drawStack(x, y0, y1, w, label) {
  const h = 14; let i = Math.floor(y0 / h);
  for (let y = y0; y < y1; y += h, i++) {
    ctx.fillStyle = BOOKS[i % BOOKS.length];
    ctx.fillRect(x, y, w, Math.min(h, y1 - y));
    ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.fillRect(x, y, w, 1);
    ctx.fillStyle = 'rgba(255,255,255,.12)'; ctx.fillRect(x + 4, y + 5, w - 8, 2);
  }
  if (label && y1 - y0 > 120) {
    ctx.save(); ctx.translate(x + w / 2 + 4, (y0 + y1) / 2); ctx.rotate(-Math.PI / 2);
    txt(label, 0, 0, 9, '#f2c14e', 'center'); ctx.restore();
  }
}
function drawLamp(x, y, label, on, align) {
  const w = 96, h = 18, xx = align === 'right' ? x - w : x;
  ctx.fillStyle = on ? '#f2c14e' : 'rgba(0,0,0,.35)'; ctx.fillRect(xx, y, w, h);
  txt(label, xx + w / 2, y + 5, 8, on ? '#232a33' : '#aab3bb', 'center');
}
function draw() {
  // sky
  const sky = ctx.createLinearGradient(0, 0, 0, GROUND);
  sky.addColorStop(0, '#6e8aa3'); sky.addColorStop(1, '#a9b8c4');
  ctx.fillStyle = sky; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = 'rgba(255,255,255,.55)';
  for (const c of clouds) { ctx.fillRect(c.x, c.y, c.w, 10); ctx.fillRect(c.x + 12, c.y - 8, c.w - 28, 8); }

  // obstacles
  for (const o of obs) {
    drawStack(o.x, 0, o.gapY, o.w, o.name);
    drawStack(o.x, o.gapY + o.gap, GROUND, o.w, o.name);
  }
  // ground / runway
  ctx.fillStyle = '#3e5a2e'; ctx.fillRect(0, GROUND, W, H - GROUND);
  ctx.fillStyle = '#5a5f66'; ctx.fillRect(0, GROUND + 18, W, 22);
  ctx.fillStyle = '#d9d4c2';
  for (let x = -(scroll % 60); x < W; x += 60) ctx.fillRect(x, GROUND + 28, 30, 3);
  txt('MAXWELL AFB', W - 8, GROUND + 44, 7, '#8fa87c', 'right');

  drawPlane(plane);

  // fog
  if (fog > 0.01) {
    ctx.fillStyle = 'rgba(206,212,216,' + (0.97 * fog).toFixed(3) + ')'; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = 'rgba(190,198,204,' + (0.5 * fog).toFixed(3) + ')';
    for (const c of clouds) { ctx.fillRect(c.x * 1.3 % W, c.y + 40, c.w * 1.6, 18); }
    ctx.globalAlpha = 1 - 0.75 * fog; drawPlane(plane); ctx.globalAlpha = 1;
  }
  // toasts
  for (const tt of toasts) txt(tt.s, tt.x, tt.y, 7, 'rgba(35,42,51,' + Math.min(1, tt.ttl) + ')');

  if (state === 'title') {
    ctx.fillStyle = 'rgba(35,42,51,.78)'; ctx.fillRect(0, 0, W, H);
    txt('FOG &', W / 2, 92, 30, '#f2c14e', 'center');
    txt('FRICTION', W / 2, 132, 30, '#f2c14e', 'center');
    wrap('Fly the B-52. Clear the reading. Score objectives.', W / 2, 200, 9, '#e6e1d3', 320, 18);
    wrap('Every few seconds the fog rolls in and you fly blind. The further you get, the longer it lasts.', W / 2, 250, 9, '#9aa4ad', 320, 18);
    txt('Tap, click, or press space', W / 2, 372, 9, '#e6e1d3', 'center');
    txt('to climb', W / 2, 390, 9, '#e6e1d3', 'center');
    if (Math.floor(t * 2) % 2 === 0) txt('PRESS TO BEGIN', W / 2, 460, 11, '#f2c14e', 'center');
    return;
  }

  // HUD
  drawLamp(10, 10, 'FOG', fog > 0.3 || (warn && Math.floor(t * 8) % 2 === 0), 'left');
  drawLamp(W - 10, 10, 'FRICTION', toasts.some(x => x.s === 'friction'), 'right');
  txt(String(score), W / 2, 12, 28, '#f9f6ec', 'center');
  txt('OBJECTIVES', W / 2, 44, 7, '#e6e1d3', 'center');

  if (banner) {
    const a = Math.min(1, banner.ttl / 0.4);
    ctx.globalAlpha = a;
    ctx.fillStyle = '#f3ead0'; ctx.fillRect(22, 70, W - 44, 84);
    ctx.fillStyle = '#232a33'; ctx.fillRect(22, 70, W - 44, 4);
    txt('CLAUSEWITZ SAYS', W / 2, 82, 8, '#8a4b2a', 'center');
    wrap(banner.text, W / 2, 100, 8, '#232a33', W - 76, 14);
    ctx.globalAlpha = 1;
  }

  if (state === 'dead') {
    ctx.fillStyle = 'rgba(35,42,51,.82)'; ctx.fillRect(0, 0, W, H);
    txt('MISSION', W / 2, 96, 26, '#e04f3f', 'center');
    txt('FAILED', W / 2, 130, 26, '#e04f3f', 'center');
    let y = wrap(deathReason, W / 2, 186, 8, '#e6e1d3', 330, 15);
    txt('OBJECTIVES  ' + score, W / 2, y + 22, 10, '#f9f6ec', 'center');
    txt('BEST  ' + best, W / 2, y + 42, 10, '#9aa4ad', 'center');
    txt('POST-MISSION ASSESSMENT', W / 2, y + 86, 8, '#f2c14e', 'center');
    wrap(grade(score), W / 2, y + 104, 8, '#e6e1d3', 330, 15);
    if (t - deadAt > 0.7 && Math.floor(t * 2) % 2 === 0) txt('PRESS TO RE-ATTACK', W / 2, 500, 10, '#f2c14e', 'center');
  }
}

// ---------- loop ----------
function loop(ts) {
  const dt = Math.min(0.05, (ts - last) / 1000 || 0); last = ts;
  update(dt); draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
