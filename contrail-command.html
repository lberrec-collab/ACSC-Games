  for (let it = 0; it < 40000; it++) {
    let found = -1;
    for (let k = 1; k <= 8; k++) {
      const d = (bdir + k) % 8, nx = cx + D[d][0], ny = cy + D[d][1];
      if (nx < 0 || ny < 0 || nx >= ow || ny >= oh) continue;
      if (sil(ny * ow + nx)) { found = d; break; }
    }
    if (found < 0) break;
    cx += D[found][0]; cy += D[found][1];
    if (cx === sx && cy === sy) break;
    contour.push({ x: cx, y: cy });
    bdir = (found + (found % 2 ? 5 : 6)) % 8; // direction of the last empty neighbour, seen from the new pixel
  }
  return { contour, enclosed };
}

// ---------- state ----------
let state = 'title', t = 0, last = 0, best = 0;
let me, trail, score, fuel, lives, shapes, flashes, toasts, bandits, tanker, tankerCool, exposure, deadAt, endReason, penises, turnKeys;
const rnd = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);

function reset() {
  me = { ...px(47.6, 29.6), a: -Math.PI / 2 };
  trail = []; score = 0; fuel = 100; lives = 3; shapes = 0; penises = 0; flashes = []; toasts = []; exposure = 0; t = 0; endReason = '';
  bandits = [{ ...px(56, 33), a: 0 }];
  tanker = { cx: px(44.8, 31.6).x, cy: px(44.8, 31.6).y, ph: 0, x: 0, y: 0, a: 0 }; tankerCool = 0;
  turnKeys = { left: false, right: false };
}
reset();
const pointers = new Map();
function toast(s, good) { toasts.push({ s, ttl: 2.2, good }); toasts = toasts.slice(-3); }

// ---------- input ----------
function canvasPt(e) { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height }; }
const BTN_Y = H - 52, BTN_H = 34;
cv.addEventListener('pointerdown', e => {
  e.preventDefault(); cv.focus();
  if (state === 'title') { state = 'play'; reset(); return; }
  if (state === 'dead') { if (t - deadAt > 0.8) { state = 'play'; reset(); } return; }
  const p = canvasPt(e);
  if (p.y > BTN_Y && p.y < BTN_Y + BTN_H) {
    if (p.x > 36 && p.x < 236) { scoreTrail(); return; }
    if (p.x > 250 && p.x < 364) { wipeTrail(); return; }
  }
  pointers.set(e.pointerId, p.x < W / 2 ? -1 : 1);
});
const up = e => pointers.delete(e.pointerId);
cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up); cv.addEventListener('pointerleave', up);
addEventListener('keydown', e => {
  if (e.code === 'ArrowLeft' || e.code === 'KeyA') { turnKeys.left = true; e.preventDefault(); }
  if (e.code === 'ArrowRight' || e.code === 'KeyD') { turnKeys.right = true; e.preventDefault(); }
  if (e.code === 'Space' || e.code === 'Enter') { e.preventDefault(); if (state === 'play') scoreTrail(); else if (state === 'title' || t - deadAt > 0.8) { state = 'play'; reset(); } }
  if ((e.code === 'KeyX' || e.code === 'Backspace') && state === 'play') { e.preventDefault(); wipeTrail(); }
});
addEventListener('keyup', e => { if (e.code === 'ArrowLeft' || e.code === 'KeyA') turnKeys.left = false; if (e.code === 'ArrowRight' || e.code === 'KeyD') turnKeys.right = false; });
function turnInput() { let s = 0; for (const v of pointers.values()) s += v; if (turnKeys.left) s -= 1; if (turnKeys.right) s += 1; return clamp(s, -1, 1); }

// ---------- geometry ----------
function segInt(a, b, c, d) {
  const rx = b.x - a.x, ry = b.y - a.y, sx = d.x - c.x, sy = d.y - c.y, den = rx * sy - ry * sx;
  if (Math.abs(den) < 1e-9) return null;
  const qx = c.x - a.x, qy = c.y - a.y, tt = (qx * sy - qy * sx) / den, uu = (qx * ry - qy * rx) / den;
  return tt > 0 && tt < 1 && uu > 0 && uu < 1 ? { x: a.x + rx * tt, y: a.y + ry * tt } : null;
}
function splash(reason) {
  lives--; exposure = 0; trail = []; toast(reason, false);
  me = { ...px(47.6, 29.6), a: -Math.PI / 2 };
  bandits.forEach((b, i) => { const p = px(56 + i * 2, 33 - i * 4); b.x = p.x; b.y = p.y; });
  if (lives <= 0) die('Shot down three times. The ATO had a SAM ring on it. You had a shape in mind.');
}
function die(reason) { if (state !== 'play') return; state = 'dead'; deadAt = t; endReason = reason; best = Math.max(best, score); }
function scoreTrail() {
  if (trail.length < 10) { toast('DRAW SOMETHING FIRST', false); return; }
  octx.fillStyle = '#000'; octx.fillRect(0, 0, OW, OH);
  octx.strokeStyle = '#fff'; octx.lineWidth = 3.2; octx.lineJoin = 'round'; octx.lineCap = 'round';
  octx.beginPath(); trail.forEach((q, i) => i ? octx.lineTo(q.x * OS, q.y * OS) : octx.moveTo(q.x * OS, q.y * OS)); octx.stroke();
  const img = octx.getImageData(0, 0, OW, OH).data, grid = new Uint8Array(OW * OH);
  for (let i = 0; i < OW * OH; i++) grid[i] = img[i * 4] > 128 ? 1 : 0;
  const sil = silhouette(grid, OW, OH);
  if (sil.open) { toast('NOTHING CLOSED. CLOSE A LOOP.', false); return; }
  const poly = sil.contour.map(q => ({ x: q.x / OS, y: q.y / OS }));
  const res = scoreShape(poly);
  if (!res || res.small) { toast('TOO SMALL. AMBITION, PLEASE.', false); return; }
  score += res.pts; shapes++;
  const big = res.label === 'SKY PENIS';
  if (big) { penises++; toast(res.pts >= 120 ? 'ANATOMICALLY AMBITIOUS. +20' : 'OKANOGAN COUNTY SALUTES YOU', true); }
  const xs = poly.map(q => q.x), ys = poly.map(q => q.y);
  flashes.push({ poly, label: res.label, pts: res.pts, ttl: big ? 3.4 : 2.2, x: (Math.min(...xs) + Math.max(...xs)) / 2, y: Math.min(...ys), big });
  trail = [];
}
function wipeTrail() { if (trail.length) { trail = []; toast('CONTRAIL WIPED', false); } }

// ---------- update ----------
function update(dt) {
  t += dt;
  SAMS.forEach(s => s.on = Math.sin(t * 0.6 + s.phase) > 0.45);
  tanker.ph += dt * 0.35; tanker.x = tanker.cx + Math.cos(tanker.ph) * 42; tanker.y = tanker.cy + Math.sin(tanker.ph) * 18; tanker.a = tanker.ph + Math.PI / 2;
  if (state !== 'play') return;

  // fly
  me.a += turnInput() * 2.2 * dt;
  const sp = 52;
  me.x += Math.cos(me.a) * sp * dt; me.y += Math.sin(me.a) * sp * dt;
  const dc = dist(me, { x: CX, y: CY });
  if (dc > R - 6) { me.x = CX + (me.x - CX) * (R - 6) / dc; me.y = CY + (me.y - CY) * (R - 6) / dc; }
  fuel -= dt * 0.6; if (fuel <= 0) die('Bingo fuel. RTB. You drew ' + shapes + ' shapes' + (penises ? ', one of which was inevitable.' : ', none of which were the shape.'));

  // trail (no auto-scoring: loops compound until you hit SCORE)
  const lastP = trail[trail.length - 1];
  if (!lastP || dist(lastP, me) > 2.5) trail.push({ x: me.x, y: me.y, t });
  trail = trail.filter(p => t - p.t < 240);

  // threats
  let inSam = false;
  for (const s of SAMS) if (s.on && dist(me, s) < s.r) inSam = true;
  exposure = inSam ? exposure + dt : Math.max(0, exposure - dt * 2);
  if (exposure > 2.2) { splash('SAM SPLASH. IT WAS ON THE ATO.'); return; }
  if (score >= 150 && bandits.length < 2) { bandits.push({ ...px(58, 29), a: 0 }); toast('SECOND BANDIT AIRBORNE', false); }
  for (const b of bandits) {
    const near = dist(b, me) < 120;
    const want = near ? Math.atan2(me.y - b.y, me.x - b.x) : b.a + Math.sin(t * 0.7) * 0.02;
    let da = want - b.a; while (da > Math.PI) da -= 2 * Math.PI; while (da < -Math.PI) da += 2 * Math.PI;
    b.a += clamp(da, -0.9 * dt, 0.9 * dt);
    const bs = (near ? 30 : 22) + Math.min(12, score * 0.03);
    b.x += Math.cos(b.a) * bs * dt; b.y += Math.sin(b.a) * bs * dt;
    const bd = dist(b, { x: CX, y: CY });
    if (bd > R - 4) { b.x = CX + (b.x - CX) * (R - 4) / bd; b.y = CY + (b.y - CY) * (R - 4) / bd; }
    if (dist(b, me) < 11) { splash('MERGED WITH A BANDIT. UNPROFESSIONAL.'); return; }
  }
  tankerCool = Math.max(0, tankerCool - dt);
  if (!tankerCool && dist(me, tanker) < 14) { fuel = Math.min(140, fuel + 35); tankerCool = 10; toast('AAR COMPLETE +35s', true); }

  for (const f of flashes) f.ttl -= dt; flashes = flashes.filter(f => f.ttl > 0);
  for (const x of toasts) x.ttl -= dt; toasts = toasts.filter(x => x.ttl > 0);
}

// ---------- draw ----------
function txt(s, x, y, size, color, align = 'left') {
  ctx.font = size + 'px "Press Start 2P", "Courier New", monospace';
  ctx.fillStyle = color; ctx.textAlign = align; ctx.textBaseline = 'top';
  ctx.fillText(s, x, y);
}
function wrap(s, x, y, size, color, maxW, lh) {
  ctx.font = size + 'px "Press Start 2P", "Courier New", monospace';
  let line = '', yy = y;
  for (const w of s.split(' ')) {
    const test = line ? line + ' ' + w : w;
    if (ctx.measureText(test).width > maxW && line) { txt(line, x, yy, size, color, 'center'); line = w; yy += lh; }
    else line = test;
  }
  if (line) txt(line, x, yy, size, color, 'center');
  return yy + lh;
}
function drawPlane(p, col) {
  ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.a);
  ctx.strokeStyle = col; ctx.lineWidth = 2; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(-6, 0); ctx.lineTo(7, 0); ctx.moveTo(1, 0); ctx.lineTo(-4, -6); ctx.moveTo(1, 0); ctx.lineTo(-4, 6); ctx.moveTo(-6, 0); ctx.lineTo(-8, -3); ctx.moveTo(-6, 0); ctx.lineTo(-8, 3); ctx.stroke();
  ctx.restore();
}
function friendly(p, label) { // 2525-style friendly air: arc
  ctx.strokeStyle = '#5ec8ff'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(p.x, p.y + 3, 7, Math.PI, 0); ctx.stroke();
  txt(label, p.x, p.y + 6, 5, '#5ec8ff', 'center');
}
function hostile(p, label) { // hostile air: chevron
  ctx.strokeStyle = '#ff4d4d'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(p.x - 7, p.y + 5); ctx.lineTo(p.x, p.y - 6); ctx.lineTo(p.x + 7, p.y + 5); ctx.stroke();
  if (label) txt(label, p.x, p.y + 8, 5, '#ff4d4d', 'center');
}
function draw() {
  ctx.fillStyle = '#060906'; ctx.fillRect(0, 0, W, H);
  ctx.save(); ctx.beginPath(); ctx.arc(CX, CY, R, 0, Math.PI * 2); ctx.clip();
  ctx.fillStyle = '#0a130c'; ctx.fillRect(0, 0, W, H);

  // land
  for (const id in MAP) {
    const hi = id === 'IRQ' || id === 'IRN';
    for (const ring of MAP[id]) {
      ctx.beginPath(); ring.forEach(([lo, la], i) => { const p = px(lo, la); i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y); }); ctx.closePath();
      ctx.fillStyle = hi ? 'rgba(57,255,106,.10)' : 'rgba(57,255,106,.045)'; ctx.fill();
      ctx.strokeStyle = hi ? 'rgba(57,255,106,.45)' : 'rgba(57,255,106,.18)'; ctx.lineWidth = 1; ctx.stroke();
    }
  }
  const iq = px(43.5, 32.6), ir = px(54.5, 33.2);
  txt('IRAQ', iq.x, iq.y, 9, 'rgba(57,255,106,.35)', 'center'); txt('IRAN', ir.x, ir.y, 9, 'rgba(57,255,106,.35)', 'center');
  const g = px(50.2, 27.1); txt('PERSIAN GULF', g.x, g.y, 5, 'rgba(94,200,255,.35)', 'center');
  for (const [n, lo, la] of CITIES) { const p = px(lo, la); ctx.fillStyle = 'rgba(57,255,106,.55)'; ctx.fillRect(p.x - 1, p.y - 1, 3, 3); txt(n, p.x + 4, p.y - 2, 4, 'rgba(57,255,106,.5)'); }

  // range rings + bearings
  ctx.strokeStyle = 'rgba(57,255,106,.22)'; ctx.lineWidth = 1;
  for (let k = 1; k <= 3; k++) { ctx.beginPath(); ctx.arc(CX, CY, R * k / 3, 0, Math.PI * 2); ctx.stroke(); }
  ctx.beginPath(); ctx.moveTo(CX - R, CY); ctx.lineTo(CX + R, CY); ctx.moveTo(CX, CY - R); ctx.lineTo(CX, CY + R); ctx.stroke();
  for (let b = 0; b < 360; b += 30) {
    const a = (b - 90) * Math.PI / 180;
    ctx.beginPath(); ctx.moveTo(CX + Math.cos(a) * (R - 8), CY + Math.sin(a) * (R - 8)); ctx.lineTo(CX + Math.cos(a) * R, CY + Math.sin(a) * R); ctx.stroke();
    txt(String(b).padStart(3, '0'), CX + Math.cos(a) * (R - 18), CY + Math.sin(a) * (R - 18) - 3, 5, 'rgba(57,255,106,.5)', 'center');
  }
  // sweep
  const sa = t * 1.6;
  const sw = ctx.createConicGradient ? ctx.createConicGradient(sa - Math.PI / 2, CX, CY) : null;
  if (sw) { sw.addColorStop(0, 'rgba(57,255,106,.22)'); sw.addColorStop(0.12, 'rgba(57,255,106,0)'); sw.addColorStop(1, 'rgba(57,255,106,0)'); ctx.fillStyle = sw; ctx.fillRect(0, 0, W, H); }
  ctx.strokeStyle = 'rgba(57,255,106,.6)'; ctx.beginPath(); ctx.moveTo(CX, CY); ctx.lineTo(CX + Math.cos(sa - Math.PI / 2) * R, CY + Math.sin(sa - Math.PI / 2) * R); ctx.stroke();

  // SAMs
  for (const s of SAMS) {
    ctx.setLineDash(s.on ? [] : [3, 4]); ctx.strokeStyle = s.on ? 'rgba(255,77,77,.8)' : 'rgba(255,77,77,.3)'; ctx.lineWidth = s.on ? 1.5 : 1;
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]);
    if (s.on) { ctx.fillStyle = 'rgba(255,77,77,.08)'; ctx.fill(); }
    ctx.strokeStyle = '#ff4d4d'; ctx.strokeRect(s.x - 4, s.y - 4, 8, 8); ctx.fillStyle = '#ff4d4d'; ctx.fillRect(s.x - 1, s.y - 1, 2, 2);
    txt('SAM', s.x, s.y + 7, 4, '#ff4d4d', 'center');
  }
  // friendlies
  friendly(AWACS, 'E-3'); friendly(BASE, 'AL UDEID'); friendly(tanker, tankerCool ? 'KC-135 (BUSY)' : 'KC-135');
  for (const b of bandits) hostile(b, 'MIG');

  // trail
  if (trail.length > 1) {
    for (let i = 1; i < trail.length; i++) {
      const age = t - trail[i].t;
      ctx.strokeStyle = 'rgba(57,255,106,' + (0.9 * Math.max(0.45, 1 - age / 240)).toFixed(2) + ')'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(trail[i - 1].x, trail[i - 1].y); ctx.lineTo(trail[i].x, trail[i].y); ctx.stroke();
    }
  }
  // scored shapes
  for (const f of flashes) {
    const a = Math.min(1, f.ttl);
    ctx.fillStyle = 'rgba(242,193,78,' + (0.35 * a).toFixed(2) + ')'; ctx.beginPath(); f.poly.forEach((p, i) => i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y)); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = 'rgba(242,193,78,' + a.toFixed(2) + ')'; ctx.lineWidth = f.big ? 3 : 1.5; ctx.stroke();
  }
  drawPlane(me, exposure > 0 ? '#ff4d4d' : GREEN);
  ctx.restore();

  // scope bezel
  ctx.strokeStyle = '#2f5a3a'; ctx.lineWidth = 6; ctx.beginPath(); ctx.arc(CX, CY, R + 3, 0, Math.PI * 2); ctx.stroke();

  // shape labels (over bezel so they never clip)
  for (const f of flashes) {
    const a = Math.min(1, f.ttl);
    ctx.globalAlpha = a;
    if (f.big) { txt('SKY PENIS', W / 2, 250, 22, '#f2c14e', 'center'); txt('MAXIMUM POINTS  +' + f.pts, W / 2, 280, 9, '#f9f6ec', 'center'); }
    else { txt(f.label, clamp(f.x, 60, W - 60), clamp(f.y - 22, TOPH + 4, H - 30), 7, '#f2c14e', 'center'); txt('+' + f.pts, clamp(f.x, 60, W - 60), clamp(f.y - 12, TOPH + 14, H - 20), 7, '#f9f6ec', 'center'); }
    ctx.globalAlpha = 1;
  }

  // HUD
  ctx.fillStyle = '#060906'; ctx.fillRect(0, 0, W, TOPH);
  ctx.fillStyle = '#2f5a3a'; ctx.fillRect(0, TOPH - 2, W, 2);
  txt('SCORE ' + score, 10, 10, 9, GREEN);
  txt('SHAPES ' + shapes, W - 10, 10, 9, GREEN, 'right');
  txt('FUEL', 10, 30, 6, 'rgba(57,255,106,.6)');
  ctx.fillStyle = 'rgba(57,255,106,.15)'; ctx.fillRect(40, 29, 120, 8);
  ctx.fillStyle = fuel < 20 ? '#ff4d4d' : GREEN; ctx.fillRect(40, 29, 120 * clamp(fuel, 0, 140) / 140, 8);
  for (let i = 0; i < 3; i++) drawPlane({ x: W - 20 - i * 18, y: 34, a: -Math.PI / 2 }, i < lives ? GREEN : 'rgba(57,255,106,.2)');
  toasts.forEach((x, i) => { ctx.globalAlpha = Math.min(1, x.ttl); txt(x.s, 10, 44 + i * 9, 6, x.good ? GREEN : '#ff4d4d'); });
  ctx.globalAlpha = 1;
  txt('< TURN', 6, BTN_Y + 13, 6, 'rgba(57,255,106,.35)'); txt('TURN >', W - 6, BTN_Y + 13, 6, 'rgba(57,255,106,.35)', 'right');
  ctx.strokeStyle = GREEN; ctx.lineWidth = 2; ctx.strokeRect(36, BTN_Y, 200, BTN_H); ctx.fillStyle = 'rgba(57,255,106,.12)'; ctx.fillRect(36, BTN_Y, 200, BTN_H);
  txt('SCORE SHAPE', 136, BTN_Y + 13, 8, GREEN, 'center');
  ctx.strokeStyle = 'rgba(57,255,106,.5)'; ctx.strokeRect(250, BTN_Y, 114, BTN_H);
  txt('WIPE', 307, BTN_Y + 13, 8, 'rgba(57,255,106,.7)', 'center');

  if (state === 'title') {
    ctx.fillStyle = 'rgba(6,9,6,.84)'; ctx.fillRect(0, 0, W, H);
    txt('CONTRAIL', W / 2, 84, 26, GREEN, 'center');
    txt('COMMAND', W / 2, 118, 26, GREEN, 'center');
    wrap('Hold the left or right side of the scope to turn. Loops you draw combine into one shape. Tap SCORE SHAPE when the masterpiece is complete.', W / 2, 180, 9, '#e6e1d3', 330, 18);
    wrap('Bigger and weirder shapes score more. Stay out of solid SAM rings, keep clear of the MiG, and hit the tanker for gas.', W / 2, 272, 9, '#9aa4ad', 330, 18);
    wrap('One shape is worth 100. You already know which one.', W / 2, 366, 9, '#f2c14e', 330, 18);
    if (Math.floor(t * 2) % 2 === 0) txt('TAP TO LAUNCH', W / 2, 470, 11, GREEN, 'center');
  }
  if (state === 'dead') {
    ctx.fillStyle = 'rgba(6,9,6,.86)'; ctx.fillRect(0, 0, W, H);
    txt('SORTIE', W / 2, 96, 26, '#ff4d4d', 'center');
    txt('COMPLETE', W / 2, 130, 26, '#ff4d4d', 'center');
    let y = wrap(endReason, W / 2, 186, 8, '#e6e1d3', 330, 15);
    txt('SCORE  ' + score, W / 2, y + 22, 10, GREEN, 'center');
    txt('SHAPES  ' + shapes + '   SKY PENISES  ' + penises, W / 2, y + 42, 8, GREEN, 'center');
    txt('BEST  ' + best, W / 2, y + 62, 10, '#9aa4ad', 'center');
    txt('POST-MISSION ASSESSMENT', W / 2, y + 104, 8, '#f2c14e', 'center');
    wrap(penises ? 'A. Airpower is inherently expressive. The wing commander disagrees.' : score >= 200 ? 'B. Creative use of the AOR. Missed the obvious.' : score >= 80 ? 'C. Drew shapes. Technically.' : 'F. Wasted the tanker. Drew a circle. Roughly.', W / 2, y + 122, 8, '#e6e1d3', 330, 15);
    if (t - deadAt > 0.8 && Math.floor(t * 2) % 2 === 0) txt('TAP TO RELAUNCH', W / 2, 520, 10, GREEN, 'center');
  }
}
const TOPH = 64;

// ---------- loop ----------
function loop(ts) {
  const dt = Math.min(0.05, (ts - last) / 1000 || 0); last = ts;
  update(dt); draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
